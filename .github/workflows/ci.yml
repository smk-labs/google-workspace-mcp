name: CI

# Quality gates: lint the Python, run the unit tests, prove the package
# installs and imports,
# and validate the plugin + marketplace manifests.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint & import (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade "ruff==0.15.15"
      - name: Ruff (lint)
        run: ruff check .
      - name: Byte-compile
        run: python -m py_compile src/google_workspace_mcp/*.py
      - name: Install package
        run: python -m pip install .
      - name: Tests
        run: |
          python -m pip install "pytest==8.4.2"
          python -m pytest -q
      - name: Import smoke test
        run: |
          python -c "from google_workspace_mcp import server, authorize, accounts, auth; import google_workspace_mcp; print('ok', google_workspace_mcp.__version__)"
          google-workspace-authorize 2>&1 | grep -q usage
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json accounts.example.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print(sys.argv[1], 'ok')" "$f"
          done
      - name: Versions agree (plugin, marketplace, package, module)
        run: |
          python3 - <<'EOF'
          import json, re, sys, tomllib
          plugin = json.load(open(".claude-plugin/plugin.json"))["version"]
          marketplace_doc = json.load(open(".claude-plugin/marketplace.json"))
          marketplace = marketplace_doc["version"]
          marketplace_plugin = marketplace_doc["plugins"][0]["version"]
          pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"',
                           open("src/google_workspace_mcp/__init__.py").read()).group(1)
          versions = [plugin, marketplace, marketplace_plugin, pyproject, init]
          print(f"versions={versions}")
          sys.exit(0 if len(set(versions)) == 1 else 1)
          EOF

  plugin:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate . --strict
