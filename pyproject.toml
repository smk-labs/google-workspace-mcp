[project]
name = "google-workspace-mcp"
version = "0.7.2"
description = "Multi-account Google Workspace MCP server (Gmail + Calendar + Drive + Tasks + Contacts) for Claude Code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.197.0",
    "google-auth>=2.53.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "mcp>=1.27.2,<2",
]

[project.urls]
Homepage = "https://github.com/smk-labs/google-workspace-mcp"
Repository = "https://github.com/smk-labs/google-workspace-mcp"
Issues = "https://github.com/smk-labs/google-workspace-mcp/issues"

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
google-workspace-mcp = "google_workspace_mcp.server:main"
google-workspace-authorize = "google_workspace_mcp.authorize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_workspace_mcp"]
